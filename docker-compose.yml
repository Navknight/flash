services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flash}
      POSTGRES_DB: flash
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U flash
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://flash:${POSTGRES_PASSWORD-flash}@db:5432/flash
      JUDGE0_URL: http://judge0:2358
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - backend

  judge0:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    privileged: true                 # isolate sandbox needs it
    env_file: judge0.conf
    environment: &judge0env
      POSTGRES_HOST: judge0-db
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:-judge0}
      REDIS_HOST: judge0-redis
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:-judge0}
    depends_on: [judge0-db, judge0-redis]

  judge0-workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    restart: unless-stopped
    privileged: true
    env_file: judge0.conf
    environment: *judge0env           # same env as above (YAML anchor)
    depends_on: [judge0-db, judge0-redis]

  judge0-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: judge0
      POSTGRES_DB: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:-judge0}
    volumes:
      - judge0db:/var/lib/postgresql/data

  judge0-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass $$REDIS_PASSWORD"]
    environment:
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:-judge0}

volumes:
  pgdata:
  caddy_data:
  judge0db:
